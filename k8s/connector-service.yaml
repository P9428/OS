apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connector-service
  template:
    metadata:
      labels:
        app: connector-service
    spec:
      containers:
      - name: connector-service
        image: connector-service:latest
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: connector-service
spec:
  selector:
    app: connector-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8001
